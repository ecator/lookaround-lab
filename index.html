<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LookaroundLab · 正则断言实验室</title>
  <meta name="description" content="从零开始,在实验室里玩转正则表达式的断言:先行、后行、肯定、否定。">
  <script>
    /* 在样式渲染前应用主题,避免闪烁 */
    (function () {
      var m = 'auto';
      try { m = localStorage.getItem('lookaroundlab.theme') || 'auto'; } catch (e) {}
      var dark = m === 'dark' || (m !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="打开目录">☰</button>
    <a class="brand" href="#/"><img src="favicon.svg" alt="" width="28" height="28"><span>LookaroundLab</span></a>
    <select id="themeSel" class="theme-sel" aria-label="主题"></select>
    <select id="langSel" class="lang-sel" aria-label="语言"></select>
    <div class="top-progress">
      <span id="rank" class="rank">断言萌新</span>
      <div class="bar"><div id="barFill" class="bar-fill"></div></div>
      <span id="pct" class="pct">0%</span>
    </div>
    <a class="gh-link" href="https://github.com/ecator/lookaround-lab" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
      <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </header>
  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="章节目录"></nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <noscript><p style="padding:2rem">请启用 JavaScript 以使用 LookaroundLab。</p></noscript>
  <script src="locales.js"></script>
  <script src="lib.js"></script>
</body>
</html>
